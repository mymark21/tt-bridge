<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TT Bridge</title>
    <link rel="stylesheet" href="/src/popup.css" />
    <script type="module" src="/src/popup.ts"></script>
  </head>
  <body>
    <main id="popup" class="popup" data-mode="off" data-view="main" data-agent-active="false" data-agent-recent="false">
      <section id="view-main" class="view-main">
        <header class="status">
          <span id="status-icon" class="status-icon" aria-hidden="true">
            <svg class="icon-broken" viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M6.5 9.5 9.5 6.5"/><path d="M7 4.5 8.2 3.3a2.2 2.2 0 0 1 3.1 3.1L10 7.7"/><path d="M9 11.5 7.8 12.7a2.2 2.2 0 0 1-3.1-3.1L6 8.3"/>
            </svg>
            <svg class="icon-linked" viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M6.8 9.2 9.2 6.8"/><path d="M6.2 5.2 7.6 3.8a2.4 2.4 0 0 1 3.4 3.4L9.6 8.6"/><path d="M9.8 10.8 8.4 12.2a2.4 2.4 0 0 1-3.4-3.4l1.4-1.4"/>
            </svg>
            <svg class="icon-active" viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M6.8 9.2 9.2 6.8"/><path d="M6.2 5.2 7.6 3.8a2.4 2.4 0 0 1 3.4 3.4L9.6 8.6"/><path d="M9.8 10.8 8.4 12.2a2.4 2.4 0 0 1-3.4-3.4l1.4-1.4"/>
            </svg>
          </span>
          <span id="status-label">未开启</span>
        </header>

        <h1 id="headline">AI 看不到你的浏览器</h1>
        <p id="subline">点一下，允许它帮你操作</p>

        <div class="actions">
          <button id="primary-action" class="btn btn-primary" type="button">允许 AI 控制</button>
          <p id="primary-hint" class="hint"></p>
          <button id="secondary-action" class="btn btn-ghost" type="button">了解权限</button>
        </div>

        <section id="window-card" class="window-card" hidden>
          <div class="window-main">
            <span id="window-title">当前窗口 · 小红书</span>
            <span id="window-tabs">3 个标签页</span>
          </div>
          <p class="window-note">跟随你切换</p>
        </section>

        <button id="details-toggle" class="details-toggle" type="button">详情</button>

        <p id="footer-note" class="footer-note">只在你选定的窗口里工作</p>
      </section>

      <section id="view-details" class="view-details" hidden>
        <header class="details-head">
          <button id="details-back" class="details-back" type="button" aria-label="返回">‹ 返回</button>
          <span class="details-title">详情</span>
        </header>

        <h2>连接</h2>
        <div class="row">
          <span>端口</span>
          <span id="port-value">19826</span>
        </div>
        <div class="row">
          <span>实例</span>
          <input id="instance-input" class="inline-input" type="text" spellcheck="false" placeholder="chrome-xxxx" />
        </div>

        <h2>账号</h2>
        <div class="row">
          <span id="profile-value">Terry T.</span>
          <span class="tag">已打码</span>
        </div>
        <div class="row">
          <span>备注名</span>
          <input id="profile-name-input" class="inline-input" type="text" spellcheck="false" placeholder="命名此 Profile" />
        </div>

        <h2>诊断</h2>
        <div class="row">
          <span id="status-text">就绪</span>
        </div>
        <div class="row">
          <span>版本</span>
          <span id="version">1.4.2</span>
        </div>
      </section>
    </main>
  </body>
</html>
